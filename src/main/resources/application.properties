spring.application.name=ai-drone-mission-commander

# Defaults for all chat paths; request options can override these individually.
spring.ai.openai.chat.max-completion-tokens=2048
spring.mvc.async.request-timeout=120s
# Only tools explicitly supplied on a request may execute; no name-based fallback.
spring.ai.tools.resolution.fallback.enabled=false
# Spring AI's aggregator logs raw provider exceptions; our handler logs sanitized diagnostics.
logging.level.org.springframework.ai.chat.model.MessageAggregator=OFF
# Binding failures can log raw arguments before the sanitized callback handles them.
logging.level.org.springframework.ai.tool.method.MethodToolCallback=OFF
# Unknown tool names are model-controlled; WorldAgentService logs a fixed failure code.
logging.level.org.springframework.ai.model.tool.DefaultToolCallingManager=OFF

springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true

# Embedding calls occur only when explicitly indexing or searching knowledge.
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.embedding.encoding-format=float
